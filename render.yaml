services:
  - type: web
    name: ello-live-token-server
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run live:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
